name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11.19.1

      - run: npm ci

      - name: Build shared
        run: npm run build -w shared

      - name: Lint backend
        run: |
          npm exec -w backend -- prisma generate
          npm run lint -w backend

      - name: Typecheck backend
        run: npm run typecheck -w backend

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11.19.1

      - run: npm ci

      - name: Lint frontend
        run: npm run lint -w frontend-web

      - name: Typecheck frontend
        run: npm run typecheck -w frontend-web
