name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@11.19.1

      - name: Build shared
        working-directory: shared
        run: |
          npm ci
          npm run build

      - name: Lint backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run lint

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@11.19.1

      - name: Install shared
        working-directory: shared
        run: npm ci

      - name: Lint frontend
        working-directory: frontend-web
        run: |
          npm ci
          npm run lint

      - name: Typecheck frontend
        working-directory: frontend-web
        run: npm run typecheck
